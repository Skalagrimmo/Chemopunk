name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  build:
    name: Build & unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0 --no-daemon --stacktrace

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemopunk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit Gradle wrapper files (self-heal)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): regenerate Gradle wrapper (adds gradle-wrapper.jar)"
            git push
          else
            echo "Wrapper already up to date."
          fi

      - name: Report failure to tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            let report = '';
            for (const job of jobs.data.jobs) {
              for (const step of job.steps || []) {
                if (step.conclusion === 'failure') {
                  report += `- failed step: **${step.name}** (job: ${job.name})\n`;
                  try {
                    const logs = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      job_id: job.id
                    });
                    const text = String(logs.data || '');
                    const lines = text.split('\n');
                    const tail = lines.slice(-150).join('\n');
                    report += `<details><summary>log tail</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>\n`;
                  } catch (e) {
                    report += `(could not fetch logs: ${e})\n`;
                  }
                }
              }
            }
            if (!report) report = '(no failed step found)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `🤖 **CI failed** on commit \`${context.sha.slice(0, 7)}\` — [run](${context.payload.repository.html_url}/actions/runs/${context.runId})\n\n${report}`
            });
