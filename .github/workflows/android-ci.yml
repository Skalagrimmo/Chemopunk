name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  build:
    name: Build & unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --no-daemon --stacktrace

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test-output.log

      - name: List built APKs
        run: find "$GITHUB_WORKSPACE" -name '*.apk' -type f | tee apk-paths.log

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemopunk-debug-apk
          path: |
            app/build/outputs/**/*.apk
            **/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Commit Gradle wrapper files (self-heal)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): regenerate Gradle wrapper (adds gradle-wrapper.jar)"
            git push
          else
            echo "Wrapper already up to date."
          fi

      - name: Report failure to tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function tailOf(file, n) {
              try {
                const text = fs.readFileSync(file, 'utf8');
                const lines = text.split('\n');
                return lines.slice(-n).join('\n');
              } catch (e) {
                return '(' + file + ' not readable: ' + e + ')';
              }
            }
            function errorLinesOf(file, n) {
              try {
                const text = fs.readFileSync(file, 'utf8');
                const lines = text.split('\n').filter(function (l) {
                  return l.startsWith('e: ') || l.indexOf('error:') !== -1;
                });
                return lines.slice(-n).join('\n');
              } catch (e) {
                return '(' + file + ' not readable: ' + e + ')';
              }
            }
            const buildTail = tailOf('build-output.log', 120);
            const testTail = tailOf('test-output.log', 60);
            const apkTail = tailOf('apk-paths.log', 40);
            const buildErrors = errorLinesOf('build-output.log', 150);
            const testErrors = errorLinesOf('test-output.log', 150);
            let report = '';
            if (!buildErrors.startsWith('(build-output.log')) {
              report += '#### Compile/build errors (filtered)\n\n';
              report += '```\n' + buildErrors + '\n```\n\n';
            }
            if (!testErrors.startsWith('(test-output.log') && testErrors !== buildErrors) {
              report += '#### Test errors (filtered)\n\n';
              report += '```\n' + testErrors + '\n```\n\n';
            }
            report += '#### Build log tail\n\n';
            report += '<details><summary>build-output.log</summary>\n\n';
            report += '```\n' + buildTail + '\n```\n\n</details>\n';
            if (!testTail.startsWith('(test-output.log')) {
              report += '#### Test log tail\n\n';
              report += '<details><summary>test-output.log</summary>\n\n';
              report += '```\n' + testTail + '\n```\n\n</details>\n';
            }
            if (!apkTail.startsWith('(apk-paths.log')) {
              report += '#### APKs found on the runner\n\n';
              report += '```\n' + apkTail + '\n```\n\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '🤖 **CI failed** on commit `' + context.sha.slice(0, 7) + '` — [run](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')\n\n' + report
            });
