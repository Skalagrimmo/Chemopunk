name: dump-sources

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump requested sources to issue #1 (manual only)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [];
            const post = async (body) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body: body
              });
            };
            await post('dump-sources is disabled (manual workflow_dispatch only, no-op).');
