name: dump-sources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump all main sources and workflows to issue #1
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [];
            const collect = (d, ext, acc) => {
              if (!fs.existsSync(d)) return acc;
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = d + '/' + e.name;
                if (e.isDirectory()) collect(p, ext, acc);
                else if (e.name.endsWith(ext)) acc.push(p);
              }
              return acc;
            };
            collect('app/src/main/java', '.kt', files);
            collect('app/src/main', '.xml', files);
            collect('.github/workflows', '.yml', files);
            files.sort();
            const CHUNK = 55000;
            const fence = '````';
            const post = async (body) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body: body
              });
            };
            for (const f of files) {
              if (!fs.existsSync(f)) { await post('### SRC-DUMP v2 `' + f + '` MISSING'); continue; }
              const content = fs.readFileSync(f, 'utf8');
              const n = Math.ceil(content.length / CHUNK);
              for (let i = 0; i < n; i++) {
                const s = i * CHUNK;
                const e = Math.min(s + CHUNK, content.length);
                const body = '### SRC-DUMP v2 `' + f + '` part ' + (i + 1) + '/' + n + ' chars ' + s + '-' + e + ' of ' + content.length + '\n\n' + fence + '\n' + content.slice(s, e) + '\n' + fence;
                await post(body);
              }
            }
